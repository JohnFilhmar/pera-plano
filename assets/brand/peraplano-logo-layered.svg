<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" role="img" aria-label="PeraPlano logo, layered">
  <title>PeraPlano (layered for native animation)</title>
  <desc>Stable ids: background, trail, airplane_body. No CSS/SMIL — animate parts natively.</desc>
  <g id="background">
    <rect x="0" y="0" width="24" height="24" rx="5.6" fill="#DCFCE7"></rect>
  </g>
  <g id="trail">
    <path d="M4 20.4 C 6.8 20 9 17.8 10.4 14.4" fill="none" stroke="#22C55E" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.12 2.1" opacity="0.6"></path>
  </g>
  <g id="airplane_body" transform="translate(12 12) scale(0.82) translate(-12 -12)">
    <path id="airplane_wing" d="M22 2 L2 9 L11 13 Z" fill="#22C55E"></path>
    <path id="airplane_hull" d="M22 2 L11 13 L15 22 Z" fill="#15803D"></path>
  </g>
</svg>