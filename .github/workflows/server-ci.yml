name: server-ci

on:
  push:
    paths: &paths
      - "server/**"
      - "docker-compose*.yml"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/deploy.yml"
      # The drift test exists to fail when this file changes. A path filter that omits
      # it makes the test unreachable from the only edit that should trigger it.
      - "docs/07-privacy-and-compliance.md"
  pull_request:
    paths: *paths

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # The api's integration tests run against a real Postgres, never a mock. Credentials
      # match apps/api/.env.example so the CI DATABASE_URL and the local one are the same
      # string; this database is disposable and the tests truncate it between cases.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peraplano
          POSTGRES_PASSWORD: peraplano
          POSTGRES_DB: peraplano
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peraplano"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @peraplano/web
      # SMOKE_SKIP_BUILD reuses the build from the step above rather than doing it twice;
      # the smoke setup still boots the real standalone server and asserts the pages serve
      # runtime compliance values rather than build-time markers.
      - run: SMOKE_SKIP_BUILD=1 npm run test:smoke
      # `npm run build -w @peraplano/api` is the api's typecheck as well as its build: the
      # root `typecheck` script names three tsconfigs explicitly and apps/api is not one of
      # them. And the root `npm test` only globs apps/web/**/__tests__ and libs/**/__tests__,
      # so the api's test/ directory needs its own step or it never runs in CI.
      # The generated Prisma client is gitignored, so a clean runner has none: without
      # this step `new PrismaClient()` throws "@prisma/client did not initialize yet".
      # `generate` reads env("DATABASE_URL") from the schema's datasource, so it needs the
      # variable even though it touches no database.
      - run: npm run db:generate -w @peraplano/api
        env:
          DATABASE_URL: postgresql://peraplano:peraplano@localhost:5432/peraplano
      # Migrations are not applied by the service container, which starts an empty
      # database. Without this the schema tests query tables that do not exist.
      - run: npm run db:deploy -w @peraplano/api
        env:
          DATABASE_URL: postgresql://peraplano:peraplano@localhost:5432/peraplano
      - run: npm run build -w @peraplano/api
      - run: npm test -w @peraplano/api
        env:
          DATABASE_URL: postgresql://peraplano:peraplano@localhost:5432/peraplano
          JWT_SECRET: ci_jwt_secret_not_a_real_secret

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action calls `GET /pulls/:number/commits` to scan just the PR's diff on a
    # pull_request event. The repo's default workflow token is contents:read only, which
    # 403s that call ("Resource not accessible by integration") — not a real finding, a
    # missing scope. contents:read is still needed for the checkout step below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip commit — a value deleted in a later
          # commit is still published if it was ever pushed.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
