# Reference nginx site for peraplano.filhmar.online.
#
# The box already runs a host nginx serving other apps (jms-e-talyer, fill-main on
# filhmar.online, genesys, kognita). This site is ADDED to it — do not remove or
# replace the other enabled sites. PeraPlano's Next.js container is published on
# 127.0.0.1:3003 (see the repo-root docker-compose.yml), so nothing reaches it
# except through this reverse proxy on the same host.
#
# server_name is the SUBDOMAIN ONLY. filhmar.online itself is served by the
# fill-main site config; listing the apex here would create two server blocks
# competing for it, which nginx resolves by whichever loaded first — a coin flip
# nobody should rely on.
#
# This file is deliberately HTTP-only. `certbot --nginx` rewrites it in place:
# it adds `listen 443 ssl`, the ssl_certificate lines, and turns the port-80
# block into an HTTPS redirect — reusing the location blocks below, so routing
# is preserved.
#
# Shipping a 443 block up front does not work: nginx refuses to load a
# `listen ... ssl` server that has no certificate, and certbot --nginx cannot
# modify a config that will not load. They deadlock before the first cert issues.
#
# Usage (on the box):
#   sudo cp docs/nginx/peraplano-production.conf /etc/nginx/sites-available/peraplano
#   sudo ln -sf /etc/nginx/sites-available/peraplano /etc/nginx/sites-enabled/peraplano
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d peraplano.filhmar.online
#
# SECURITY HEADERS ARE NOT SET HERE. Content-Security-Policy, Strict-Transport-Security,
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy all come from the app, in
# server/apps/web/next.config.ts, and pass through this proxy untouched. Do not add
# `add_header` copies of them:
#   - two sources drift, and the copy that drifts is the one nobody tests;
#   - nginx sends both values rather than replacing one, and a browser given two CSP
#     headers enforces the INTERSECTION, so a well-meant second policy silently subtracts
#     from the first;
#   - `add_header` only inherits downward when a block defines none of its own, so a
#     server-level header added here would already be missing from the
#     `location /_next/static/` block below, which has its own add_header.
# certbot --nginx adds the HTTPS redirect but no HSTS of its own, which is why the app
# sends it. If a header ever has to be set at this layer, delete it from next.config.ts in
# the same change.
#
# DNS for peraplano.filhmar.online must resolve to this box before certbot runs.
# Renewal is automatic via certbot's systemd timer (installed with the certbot
# package) — the acme-challenge location below keeps working after the redirect
# is added, so renewals succeed unattended.

upstream peraplano_web {
    server 127.0.0.1:3003;
}

server {
    listen 80;
    listen [::]:80;
    server_name peraplano.filhmar.online;

    # This site accepts no uploads and posts no bodies — every route is a GET of a
    # static legal or marketing page. 1m is already more than anything legitimate
    # here needs, and a small cap is one fewer way to spend the box's memory.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # X-Forwarded-Proto tells the app the original request was HTTPS, which is what
    # keeps canonical tags and redirects on https:// after certbot adds the 443 block.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Let the ACME http-01 challenge through untouched — first issuance and every
    # renewal after certbot adds the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Long-cache immutable Next.js build assets. Content-hashed filenames, so a
    # deploy invalidates by changing the name rather than by expiry.
    location /_next/static/ {
        proxy_pass http://peraplano_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The container's own liveness endpoint. Not proxied: it exists for the Docker
    # HEALTHCHECK on the loopback interface, and the body reports whether compliance
    # configuration is complete — publishing "this deployment is half-configured" to
    # the internet is free reconnaissance for no benefit. Delete this block if an
    # external uptime monitor needs to reach it; monitoring GET / works just as well.
    location = /api/health {
        return 404;
    }

    # THE API BELONGS TO ONE HOSTNAME, AND IT IS NOT THIS ONE. The ruleset route
    # lives in this same container (it is a Next.js route, not a service), so the
    # catch-all below would otherwise serve /v1/parser_rules here as well — which
    # it did, publicly, from the moment the route first deployed. Nothing asks for
    # it on this name: both EAS profiles point at api.peraplano.filhmar.online (see
    # mobile/eas.json), so a second copy on the marketing hostname is reachable
    # only by someone who went looking.
    #
    # Refused rather than redirected. A redirect would make this name a working
    # route to the API, which is how a client ends up depending on the wrong one;
    # 404 says it is not here and never was. The API's own site is
    # docs/nginx/peraplano-api-production.conf.
    location ^~ /v1/ {
        return 404;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://peraplano_web;
    }
}
