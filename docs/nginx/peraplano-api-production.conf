# Reference nginx site for api.peraplano.filhmar.online — the parser-ruleset
# channel (docs/03-ingest-pipeline.md §11.2, GAP-043).
#
# SAME CONTAINER, SEPARATE HOSTNAME. There is no second service and no second
# port: the ruleset route is a Next.js route in the app already published on
# 127.0.0.1:3003. The subdomain exists so the API has its own name, its own
# certificate, and its own surface, which is what lets the ruleset move behind a
# different service later without a mobile release.
#
# proxy_pass GOES STRAIGHT TO 127.0.0.1:3003 RATHER THAN THE `peraplano_web`
# UPSTREAM the sibling site defines. An upstream block lives in nginx's global
# http context, so declaring `peraplano_web` a second time here makes nginx
# refuse to load ("duplicate upstream"), and merely referencing the sibling's
# copy makes this file fail whenever that site is disabled. A literal address
# costs one line of duplication and cannot break the other site.
#
# NOTHING BUT THE API IS SERVED HERE. `location /` returns 404 rather than
# proxying, so the marketing and legal pages are reachable on exactly one
# hostname. Proxying them here would put the same pages on two names, which is
# duplicate content to a crawler and a second surface to keep in step.
#
# HTTP-ONLY ON PURPOSE, exactly as the sibling site explains: `certbot --nginx`
# rewrites this file in place, adding `listen 443 ssl`, the ssl_certificate
# lines, and turning the port-80 block into a redirect, reusing the location
# blocks below. Shipping a 443 block up front deadlocks, because nginx will not
# load a `listen ... ssl` server with no certificate and certbot cannot edit a
# config that will not load.
#
# Usage (on the box), AFTER DNS for api.peraplano.filhmar.online resolves here:
#   sudo cp docs/nginx/peraplano-api-production.conf /etc/nginx/sites-available/peraplano-api
#   sudo ln -sf /etc/nginx/sites-available/peraplano-api /etc/nginx/sites-enabled/peraplano-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.peraplano.filhmar.online
#
# ORDER MATTERS, AND GETTING IT WRONG IS RECOVERABLE BUT CONFUSING. Run certbot
# AFTER this site is enabled, never before. Certbot picks a vhost by matching the
# hostname it is given, and with no site claiming that name it attaches to
# sites-available/default instead: on 2026-09-25 it cloned the default server
# block, pointed server_name at this hostname, left root at /var/www/html, and
# added the 443 listener and certificate there. The result answered TLS on this
# hostname and served the nginx default page, and enabling this file afterwards
# produced nginx: [warn] conflicting server name ... ignored, which passes
# nginx -t and silently leaves the wrong block serving.
#
# If that has already happened: delete certbot's two api server blocks from
# sites-available/default (the cloned one with the certificate, and the :80
# redirect stub returning 404), keep the real default_server block, reload, then
# re-run certbot. The certificate itself is fine and is not re-issued.
#
# Then confirm the certificate is real rather than assumed:
#   curl -sI https://api.peraplano.filhmar.online/v1/parser_rules | head -3
#   openssl s_client -connect api.peraplano.filhmar.online:443 \
#     -servername api.peraplano.filhmar.online </dev/null 2>/dev/null \
#     | openssl x509 -noout -subject -dates -issuer
#
# The second command is the one worth running: it prints the issuer and the
# validity window, so a self-signed or mismatched certificate is visible instead
# of being trusted because the page loaded. Renewal is automatic via certbot's
# systemd timer, and the acme-challenge location below keeps working after the
# redirect is added, so renewals succeed unattended.
#
# THE CERTIFICATE IS NOT WHAT MAKES A RULESET TRUSTWORTHY, and it must not be
# mistaken for it. TLS proves the phone reached this host; the Ed25519 signature
# over the body proves the bundle came from the owner's offline key. The app
# refuses an unsigned or wrongly signed bundle over a perfectly valid HTTPS
# connection, which is the whole point of GAP-043 rule 2.

server {
    server_name api.peraplano.filhmar.online;

    # Every route here is a GET with no body. The ruleset response is capped at
    # 256 KB by the client (MAX_RESPONSE_CHARS) and nothing posts, so anything
    # above this is either a mistake or an attack.
    client_max_body_size 8k;

    # Let the ACME http-01 challenge through untouched — first issuance and
    # every renewal after certbot adds the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The ruleset channel. Versioned in the path so a later move to a separate
    # service re-points here instead of stranding every installed app.
    location /v1/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # The bundle is immutable for a given version and the client asks at
        # most once a day, so there is nothing to gain from caching it here and
        # something to lose: a cached body served with a stale
        # `x-ruleset-signature` from a different version would fail
        # verification on every device until the cache expired.
        proxy_buffering off;
    }

    # Not the app's liveness endpoint, for the same reason the sibling site
    # blocks it: the body says whether the deployment is half-configured.
    location = /api/health {
        return 404;
    }

    # This hostname is the API and nothing else.
    location / {
        return 404;
    }

    listen 80;
}
