# PeraPlano — server-side only. mobile/ is not containerised and no service here
# references it.
#
# Port allocation on this box, so the next person allocating one does not collide:
#   3000 / 5000  jms-e-talyer production
#   3001         fill-main (filhmar.online)
#   3002 / 5002  genesys production
#   3003         peraplano-web PRODUCTION — peraplano.filhmar.online
#   3004         peraplano-web STAGING — direct port, no reverse proxy yet
#   5003         kognita production
#   5004         kognita staging
#   5005         RESERVED for a future PeraPlano backend. Do not take it.
#
# This file lives at the repo root rather than inside server/ because a second service
# (an API, a worker) would be a sibling of server/, and a compose file that has to move
# the first time the system grows is a compose file everyone learns to distrust.
# Pinned so the compose project name does not depend on what the checkout directory
# happens to be called — container, network and volume names are stable across clones.
#
# This base file publishes no ports and injects no runtime config, so the same file is
# reused unmodified by all three overlays below without a host-port or env collision
# between them:
#   docker-compose.override.yml    local `docker compose up` (auto-loaded, no -f flags)
#   docker-compose.staging.yml     staging deploy (.github/workflows/deploy.yml)
#   docker-compose.production.yml  production deploy (.github/workflows/deploy.yml)
name: peraplano

services:
  peraplano-web:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  postgres:
    # Behind a profile deliberately. `.github/workflows/deploy.yml` runs
    # `docker compose ... up -d --build --remove-orphans` with no service list, so
    # without this every staging and production deploy would start a Postgres with
    # the development credentials below, serving nothing. A profile means the
    # service exists for local work and for the day the api deploys, and starts
    # only when something asks for it by name. `npm run db:up` passes the profile.
    profiles: ["api"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peraplano
      POSTGRES_PASSWORD: peraplano
      POSTGRES_DB: peraplano
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peraplano"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
